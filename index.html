      /* Dramatic Entrance Animations - Supercharged */

      .animate-slide-up {

      @keyframes fade-in {

      }
      .animate-fade-in {

      }

      @keyframes pulse-fast {

        50% { opacity: 0.6; transform: scale(1.05); }
      }
      .animate-pulse-fast {
        animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse-blue {
        0% {
          box-shadow: 0 0 0 0 rgba(30, 99, 255, 0.7);
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
        70% {

        }
        100% {

        }

        }

        }

          transform: scale(1.35) translate(-4%, 3%);
        }
      }
      .ken-burns {
        animation: ken-burns 25s ease-out forwards;
      }

      @keyframes float {

        50% { transform: translateY(-25px); }
      }

      }

        60% { transform: scale(1.2); opacity: 1; }
        80% { transform: scale(0.95); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
